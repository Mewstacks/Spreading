name: Fly production power

# Produ??o ligada 24/7: n?o existe parada autom?tica noturna.
# Os cron abaixo s? iniciam m?quinas paradas e conferem sa?de.
# Stop permanece exclusivamente no acionamento manual de emerg?ncia.

on:
  # Horários em UTC. O Brasil não tem mais horário de verão, então BRT = UTC-3 o
  # ano inteiro e o mapa abaixo não precisa de exceção sazonal.
  schedule:
    - cron: "45 10 * * *"  # 07:45 BRT — religamento
    # Rede de segurança, e ela precisou ficar MAIOR. O que derrubou a produção em
    # 16, 17 e 18/08/2026 não foi a parada: foi o religamento falhar sem ninguém
    # de pé para perceber — sem web não há vigia externo, e o dia inteiro se
    # perdeu. Aconteceu de novo em 07/09/2026, e desta vez a causa ficou clara: o
    # agendador do GitHub é best-effort e DESCARTA execuções. Naquele dia a parada
    # das 04:00 UTC só rodou às 09:11, e os religamentos das 10:45 e 11:20 não
    # rodaram nenhuma vez — a produção passou a manhã inteira fora, incluindo a
    # janela de envio das 08:00.
    #
    # `start` é idempotente (máquina ligada só revalida health), então cada
    # tentativa extra custa alguns segundos de runner e cobre a chance de o
    # agendador engolir as anteriores. Para a produção passar o dia fora agora, o
    # GitHub teria de descartar todas.
    #
    # Nenhum horário cai em :00. Em 08/09/2026 os religamentos das 10:45 e 11:20
    # UTC foram os dois descartados e a produção passou a manhã fora; a
    # documentação do GitHub avisa que o `schedule` atrasa "durante períodos de
    # alta carga de execuções", e cita o INÍCIO DE CADA HORA como o pico. Quatro
    # das seis tentativas antigas estavam exatamente aí. Minuto quebrado é de
    # graça e sai da fila mais cheia.
    - cron: "20 11 * * *"  # 08:20 BRT — 2a tentativa
    - cron: "58 11 * * *"  # 08:58 BRT — 3a
    - cron: "9 12 * * *"   # 09:09 BRT — 4a
    - cron: "37 13 * * *"  # 10:37 BRT — 5a
    - cron: "23 15 * * *"  # 12:23 BRT — 6a
    - cron: "11 18 * * *"  # 15:11 BRT — 7a
  workflow_dispatch:
    inputs:
      action:
        description: Ação manual
        required: true
        type: choice
        options:
          - start
          - stop

permissions:
  contents: read

concurrency:
  group: fly-production-power
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Resolve action
        id: action
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Manual vence o agendado: o botão é a parada de emergência.
          if [[ -n "$MANUAL_ACTION" ]]; then
            echo "action=$MANUAL_ACTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "45 10 * * *") ACAO=start ;;
            "20 11 * * *") ACAO=start ;;
            "58 11 * * *") ACAO=start ;;
            "9 12 * * *")  ACAO=start ;;
            "37 13 * * *") ACAO=start ;;
            "23 15 * * *") ACAO=start ;;
            "11 18 * * *") ACAO=start ;;
            *)
              echo "Horário $SCHEDULE não está no mapa; nada a fazer." >&2
              exit 1
              ;;
          esac
          echo "Agendamento $SCHEDULE -> $ACAO"
          echo "action=$ACAO" >> "$GITHUB_OUTPUT"
      - name: Start or stop Fly production
        env:
          FLY_TOKEN_WEB: ${{ secrets.FLY_TOKEN_WEB }}
          FLY_TOKEN_WA: ${{ secrets.FLY_TOKEN_WA }}
          FLY_TOKEN_DB: ${{ secrets.FLY_TOKEN_DB }}
        run: bash deploy/fly-nightly-power.sh "${{ steps.action.outputs.action }}"
