name: Fly production power

# Desligamento noturno: para às 01:00 BRT e religa às 07:45. Sete horas paradas
# cortam cerca de 29% do custo de máquinas — a diferença entre ficar acima e
# abaixo do teto de R$300/mês que o produto tem de respeitar.
#
# Ele já existiu, foi removido, e o motivo importa mais que o horário: em 16, 17
# e 18/08/2026 o RELIGAMENTO falhou e, como à noite não sobra nada de pé (sem web
# não há vigia externo), a produção ficou fora do ar o dia inteiro até alguém
# perceber. Três interrupções totais em três dias. A parada nunca foi o problema.
#
# O que mudou desde então, e é o que justifica religar:
#
#   - `deploy/fly-nightly-power.sh` ganhou `wait_until_healthy`, ordem de
#     dependência (banco -> WhatsApp -> web) e filtro de checks — a regra antiga
#     exigia TODOS os checks e era ela que matava o start;
#   - há uma SEGUNDA tentativa de start às 08:20, porque `start` é idempotente e
#     cobre exatamente o modo de falha que causou os três apagões;
#   - religa 07:45, quinze minutos antes da janela de envio (08:00), para o
#     WhatsApp terminar de autenticar (~50s) antes do primeiro tique.
#
# Nada se perde na parada: credencial do Mercado Livre está cifrada no Postgres
# com a KEK em Fly secret, a sessão do WhatsApp mora no volume `wa_data`, e o
# cache do leitor de cupons foi movido de LocMem para tabela no banco justamente
# porque morria a cada ciclo.
#
# O acionamento manual continua aqui de propósito: é o botão de parada de
# emergência e o de religar quando algo ficou preso.

on:
  # Horários em UTC. O Brasil não tem mais horário de verão, então BRT = UTC-3 o
  # ano inteiro e o mapa abaixo não precisa de exceção sazonal.
  schedule:
    - cron: "0 4 * * *"    # 01:00 BRT — parada
    - cron: "45 10 * * *"  # 07:45 BRT — religamento
    # Rede de segurança. O que derrubou a produção em 16, 17 e 18/08/2026 não foi
    # a parada: foi o religamento falhar sem ninguém de pé para perceber — sem web
    # não há vigia externo, e o dia inteiro se perdeu. `start` é idempotente
    # (máquina já ligada só revalida health), então uma segunda tentativa custa
    # nada e cobre exatamente aquele modo de falha.
    - cron: "20 11 * * *"  # 08:20 BRT — segunda tentativa
  workflow_dispatch:
    inputs:
      action:
        description: Ação manual
        required: true
        type: choice
        options:
          - start
          - stop

permissions:
  contents: read

concurrency:
  group: fly-production-power
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Resolve action
        id: action
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Manual vence o agendado: o botão é a parada de emergência.
          if [[ -n "$MANUAL_ACTION" ]]; then
            echo "action=$MANUAL_ACTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "0 4 * * *")   ACAO=stop  ;;
            "45 10 * * *") ACAO=start ;;
            "20 11 * * *") ACAO=start ;;
            *)
              echo "Horário $SCHEDULE não está no mapa; nada a fazer." >&2
              exit 1
              ;;
          esac
          echo "Agendamento $SCHEDULE -> $ACAO"
          echo "action=$ACAO" >> "$GITHUB_OUTPUT"
      - name: Start or stop Fly production
        env:
          FLY_TOKEN_WEB: ${{ secrets.FLY_TOKEN_WEB }}
          FLY_TOKEN_WA: ${{ secrets.FLY_TOKEN_WA }}
          FLY_TOKEN_DB: ${{ secrets.FLY_TOKEN_DB }}
        run: bash deploy/fly-nightly-power.sh "${{ steps.action.outputs.action }}"
