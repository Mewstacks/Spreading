name: Fly production power

# O DESLIGAMENTO NOTURNO FOI REMOVIDO. Ele parava as três apps às 00:00 BRT e
# tentava religar às 08:00, economizando cerca de um terço da fatura de máquinas
# (~US$12/mês sobre ~US$38 de infra). O preço era alto demais:
#
#   - 8 horas por dia sem coletar cupom, sem enviar e sem verificar link;
#   - a sessão de WhatsApp atravessava o ciclo e às vezes não voltava;
#   - o religamento falhou em 16, 17 e 18/08/2026, e como à noite não sobra nada
#     de pé (sem web não há vigia externo), a produção ficou fora do ar o dia
#     inteiro até alguém perceber. Três interrupções totais em três dias.
#
# Para um produto vendido por assinatura isso é inaceitável: o assinante paga o
# mês inteiro e recebe dois terços dele. Economia de custo agora vem de consolidar
# processos e tirar trabalho do navegador, não de desligar a operação.
#
# O acionamento manual continua aqui de propósito: é o botão de parada de
# emergência e o de religar quando algo ficou preso.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Ação manual
        required: true
        type: choice
        options:
          - start
          - stop

permissions:
  contents: read

concurrency:
  group: fly-production-power
  cancel-in-progress: false

jobs:
  power:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Resolve action
        id: action
        env:
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          # Sem gatilho agendado, a única origem é o acionamento manual. O ramo
          # que traduzia `github.event.schedule` saiu junto com o cron: manter um
          # mapa de horários que nunca dispara é convite para religá-lo sem querer.
          if [[ -z "$MANUAL_ACTION" ]]; then
            echo "Nenhuma ação informada; este workflow é só manual." >&2
            exit 1
          fi
          echo "action=$MANUAL_ACTION" >> "$GITHUB_OUTPUT"
      - name: Start or stop Fly production
        env:
          FLY_TOKEN_WEB: ${{ secrets.FLY_TOKEN_WEB }}
          FLY_TOKEN_WA: ${{ secrets.FLY_TOKEN_WA }}
          FLY_TOKEN_DB: ${{ secrets.FLY_TOKEN_DB }}
        run: bash deploy/fly-nightly-power.sh "${{ steps.action.outputs.action }}"
