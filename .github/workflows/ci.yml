name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      # test_hardening_ui_e2e lança Chromium de verdade; sem este passo o runner
      # não tem o browser e o job cai com "Executable doesn't exist".
      - run: python -m playwright install --with-deps chromium
      - run: python django/manage.py check
      - run: python django/manage.py makemigrations --check --dry-run
      - run: python django/manage.py test apps.scrapers apps.accounts

  # A suite acima roda em SQLite, onde nao existe RLS, nem constraint parcial,
  # nem o ramo PostgreSQL do lease. Foi exatamente ai que a producao divergiu do
  # verde: os testes do redirect passavam enquanto todo link publicado respondia
  # 404 em producao, porque a policy de tenant escondia a linha do visitante
  # anonimo. Este job roda o mesmo DDL que o release_command aplica em producao,
  # e depois a suite inteira contra Postgres.
  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    services:
      db:
        # Mesma major da producao (spreading-db roda postgres-flex 17.x).
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spreading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Sem `DJANGO_DEBUG=0` e sem `APP_ENV`, de propósito: o mesmo ambiente do job
      # em SQLite. Com DEBUG desligado o settings liga `SECURE_SSL_REDIRECT`, e o
      # cliente de teste fala HTTP — toda requisição vira 301 e a suíte inteira
      # cai (163 falhas + 182 erros na primeira execução, nenhuma delas real).
      # Quem valida a configuração de produção é o `check --deploy` do
      # release_command; o papel deste job é o BANCO.
      DJANGO_SECRET_KEY: ci-somente-para-testes-nao-vale-em-lugar-nenhum
      TENANT_CONTEXT_SIGNING_KEY: ci-chave-de-assinatura-de-contexto-para-testes
      # As tres roles do desenho multi-tenant. Senhas descartaveis de um servico
      # que so existe dentro deste job.
      # A suite conecta como `spreading_migration`, e a escolha tem motivo.
      #
      # `system_context()` chama `_assert_privileged_database_role()`, que so aceita
      # a role de sistema ou a de migracao — e com razao: quem abre contexto
      # cross-tenant tem de ser um processo de sistema. Como `spreading_runtime`, 38
      # testes de worker morriam em PermissionDenied antes da primeira query.
      #
      # Entre as duas permitidas, a de migracao e a unica possivel: o banco de teste
      # e criado pela propria conexao, entao essa role vira DONA das tabelas — e a
      # role de sistema tem uma checagem a mais que proibe exatamente isso ("a role
      # de workers nao pode ser dona de tabela tenant"). Em producao quem e dona das
      # tabelas e `spreading_migration`, entao a posse aqui reproduz a de la.
      #
      # Nenhuma das tres tem SUPERUSER ou BYPASSRLS. Quem prova isolamento continua
      # sendo o `tenant_isolation_probe`, que roda com a role de runtime.
      DATABASE_URL: postgres://spreading_migration:ci@localhost:5432/spreading
      SYSTEM_DATABASE_URL: postgres://spreading_system:ci@localhost:5432/spreading
      MIGRATION_DATABASE_URL: postgres://spreading_migration:ci@localhost:5432/spreading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      # Mesmas tres roles e mesmos privilegios que `deploy/phase0-remote-bootstrap.py`
      # instala em producao. Sao a base do desenho: a role que atende requisicao
      # NAO pode ser dona das tabelas nem ter BYPASSRLS, senao a policy nao vale
      # nada — e e justamente isso que o probe mais abaixo cobra.
      - name: Cria as roles e a extensao que o RLS assinado exige
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d spreading -v ON_ERROR_STOP=1 <<'SQL'
          -- CREATEDB nas duas que criam banco de teste: a de migracao roda a suite.
          CREATE ROLE spreading_migration LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci' CREATEDB;
          CREATE ROLE spreading_system    LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci';
          -- CREATEDB so no runtime: e ele quem cria o banco de teste do Django.
          CREATE ROLE spreading_runtime   LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci' CREATEDB;
          GRANT CONNECT ON DATABASE spreading TO spreading_runtime, spreading_system, spreading_migration;
          ALTER DATABASE spreading OWNER TO spreading_migration;
          GRANT USAGE ON SCHEMA public TO spreading_runtime, spreading_system;
          GRANT USAGE, CREATE ON SCHEMA public TO spreading_migration;
          SQL
          # O banco de TESTE do Django nasce clonando `template1`, e a migração
          # 0061 cria policies que chamam `tenant_security.context_valid`. Sem o
          # schema no template, cada `manage.py test` recria um banco que não tem
          # de onde herdá-lo e a migração falha com `schema "tenant_security" does
          # not exist` — o mesmo muro que o `--only-context` resolve no banco
          # principal, um nível acima.
          psql -h localhost -U postgres -d template1 -v ON_ERROR_STOP=1             -c 'GRANT CREATE ON DATABASE template1 TO spreading_migration'
          psql -h localhost -U postgres -d template1 -v ON_ERROR_STOP=1             -c 'GRANT USAGE, CREATE ON SCHEMA public TO spreading_migration'
          psql -h localhost -U postgres -d template1 -v ON_ERROR_STOP=1             -c 'GRANT USAGE ON SCHEMA public TO spreading_runtime, spreading_system' 
          # pgcrypto no template1 tambem: o banco de teste nasce clonando dele, e
          # o verificador de contexto assinado depende do hmac.
          for db in spreading template1; do
            psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public'
          done
      # Antes do migrate: a 0061 cria policies que chamam
      # `tenant_security.context_valid`, entao o schema assinado tem de existir
      # primeiro. Num banco ja provisionado isto e no-op.
      - name: Instala o contexto assinado (no banco e no template)
        run: |
          set -euo pipefail
          RELEASE_COMMAND=1 python django/manage.py tenant_rls --only-context
          # E no template, para todo banco de teste já nascer com ele.
          RELEASE_COMMAND=1             MIGRATION_DATABASE_URL=postgres://spreading_migration:ci@localhost:5432/template1             python django/manage.py tenant_rls --only-context
      - name: Migra com a role de migracao (o mesmo caminho do release_command)
        run: RELEASE_COMMAND=1 python django/manage.py migrate --noinput
      # Depois do migrate: antes disso nao ha tabela para dar privilegio sobre.
      - name: Da a runtime e a system o acesso as tabelas
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d spreading -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public
            TO spreading_runtime, spreading_system;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public
            TO spreading_runtime, spreading_system;
          ALTER DEFAULT PRIVILEGES FOR ROLE spreading_migration IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES
            TO spreading_runtime, spreading_system;
          ALTER DEFAULT PRIVILEGES FOR ROLE spreading_migration IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES
            TO spreading_runtime, spreading_system;
          SQL
      - name: Instala as constraints de tenant
        run: RELEASE_COMMAND=1 python django/manage.py tenant_constraints --ensure
      - name: Aplica o RLS assinado
        run: RELEASE_COMMAND=1 python django/manage.py tenant_rls --enable
      - name: Prova, com a role runtime, que GUC falsificado nao atravessa tenant
        env:
          # Explicito porque o `DATABASE_URL` do job aponta para a role de migracao
          # (ver o comentario la em cima). Este passo, e so ele, tem de falar com o
          # banco como a role que atende requisicao — senao nao prova nada.
          DATABASE_URL: postgres://spreading_runtime:ci@localhost:5432/spreading
        run: python django/manage.py tenant_isolation_probe
      # A suíte roda com a role de runtime, a mesma da produção.
      #
      # O que este passo prova é a SEMÂNTICA DO POSTGRES: constraint parcial,
      # `UniqueConstraint` com condição, operadores de JSON, `bulk_create` com
      # `update_conflicts`, o ramo PostgreSQL do lease — tudo que o SQLite finge
      # que funciona. Quem prova o ISOLAMENTO é o passo anterior,
      # `tenant_isolation_probe`, que roda com esta mesma role contra o banco já
      # provisionado e reprova GUC falsificado.
      #
      # O banco de teste do Django nasce de `migrate` e não passa pelo
      # `release_command`, então ele NÃO tem RLS ligado — o `--enable` é etapa de
      # release. Isso é consistente desde 07/09/2026: antes, duas migrações
      # ligavam RLS por conta própria e o banco de teste nascia protegido em duas
      # tabelas e em nenhuma das outras trinta e poucas.
      - name: Suite completa contra PostgreSQL
        run: python django/manage.py test apps.scrapers apps.accounts
      # Quem sobrou segurando o banco de teste.
      #
      # A suite passa inteira e o job ainda falha no teardown do Django com
      # `database "test_spreading" is being accessed by other users`. Uma conexao
      # fica pendurada, e isso NAO e so chateacao de CI: e o mesmo vazamento que
      # `organization_thread_target` existe para evitar — conexao aberta por uma
      # thread que morreu sem devolve-la. Em produção isso acumula ate o processo
      # reiniciar.
      #
      # Este passo nao conserta nada; ele nomeia o culpado. `pg_stat_activity`
      # mostra a query e o estado da sessao sobrevivente, que e a informacao que
      # falta para consertar a causa em vez do sintoma.
      - name: Quem ficou segurando o banco de teste
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "
            SELECT pid, state, application_name,
                   now() - state_change AS parado_ha,
                   left(regexp_replace(query, '\s+', ' ', 'g'), 160) AS ultima_query
              FROM pg_stat_activity
             WHERE datname = 'test_spreading'
             ORDER BY state_change;
          " || true

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node.js/package-lock.json
      - run: npm ci
      - run: npm test
