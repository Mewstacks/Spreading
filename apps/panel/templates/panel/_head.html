  <style>
    /* Spreading · design system (o mesmo do v1): papel quente + grafite, acento #eb4a19,

    :root {

    [data-theme="light"] {
      --bg: #f2f0ea; --bg-inset: #eceade; --side-bg: #ebe9de;
      --surface: #faf9f5; --surface-2: #f0eee6; --surface-3: #e9e6dc; --field: #fdfcf8;

    /* ── página ── */

    @media (min-width: 900px) { .stat-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .stat-cell { padding: 1.05rem 1.25rem; min-width: 0; border-top: 1px solid var(--border); }
    .stat-cell:nth-child(-n+2) { border-top: 0; }
    @media (min-width: 900px) { .stat-cell { border-top: 0; border-left: 1px solid var(--border); }
      .stat-cell:first-child { border-left: 0; } }
    @media (max-width: 899px) { .stat-cell:nth-child(even) { border-left: 1px solid var(--border); } }
    .kpi-label { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase;

    .kpi-value { margin-top: .35rem; font-size: 1.7rem; font-weight: 600; letter-spacing: -.03em; line-height: 1.1;

    .rows { border-top: 1px solid var(--border); list-style: none; margin: 0; padding: 0; }

    /* ── botões ── */

    td.cell-grow, th.cell-grow { white-space: normal; width: 100%; }

    .cell-prod { display: flex; align-items: center; gap: .8rem; min-width: 0; }
    .thumb { width: 44px; height: 44px; flex: none; object-fit: contain; border-radius: var(--r-md); background: #fff;
