# Fly.io — serviço WhatsApp (whatsapp-web.js + Chromium). Somente 6PN/.internal.
# Secret: WA_CAPABILITY_PUBLIC_KEYS_JSON (somente chaves públicas Ed25519).
app = "spreading-wa"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "always"

[env]
  PORT = "3000"
  WA_CAPABILITY_ISSUER = "spreading-web"
  WA_CAPABILITY_AUDIENCE = "spreading-wa"
  # 1, não 2. Cada sessão é um Chromium rodando o WhatsApp Web inteiro, e esta VM
  # comporta UM. Medido em 18/08/2026, mesmo script e mesmo pin de bundle:
  #
  #   VM ociosa, 1 Chromium ........... QR em 37s
  #   2 bootstraps simultâneos ........ nenhum QR em 150s
  #   1 conectado + 1 bootstrap ....... nenhum QR em 150s
  #
  # A terceira linha é a que decide este número. O portão de bootstrap
  # (bootstrap_gate.js) serializa bootstraps ENTRE SI e acabou com o espiral de
  # reciclagem, mas uma sessão já conectada não está no portão: o Chromium dela
  # consome CPU o tempo todo, e com ele de pé nenhum QR nasce. Prometer 2 slots
  # aqui era prometer o que o hardware não entrega — a segunda sessão ficava
  # eternamente em "preparando o leitor" em vez de receber um "sem capacidade"
  # honesto. O aviso de sempre continua valendo ao contrário: subir este número
  # exige subir o [[vm]] junto (o passo barato é shared-cpu-4x/4gb, +US$2,24/mês).
  MAX_WHATSAPP_SESSIONS = "1"
  SESSION_START_STAGGER_MS = "12000"
  SESSION_INIT_TIMEOUT_MS = "90000"
  # O watchdog mede bloqueio do event loop, não duração de uma operação async.
  # Um bootstrap frio recebe a mesma janela da inicialização normal.
  QR_BOOTSTRAP_TIMEOUT_MS = "90000"
  # QR_BOOTSTRAP_MAX_ATTEMPTS saiu daqui: o pin "2" era anterior ao default 4 do
  # index.js (desistir em 2 fazia a tela cair em "não foi possível gerar um QR
  # novo" cedo demais; cada tentativa recicla só o Chromium, custo baixo).
  QR_BOOTSTRAP_RETRY_MS = "2000"
  # GROUP_SYNC_TIMEOUT_MS e SEND_TIMEOUT_MS saíram daqui de propósito: os dois
  # sobrepunham o código com valores que o próprio código já descartava.
  # GROUP_SYNC_TIMEOUT_MS=45000 era o valor da época do getChats completo; hoje a
  # leitura é em memória e o default de 15s é deliberado. SEND_TIMEOUT_MS=60000
  # era limitado a 55000 pelo SEND_REQUEST_TIMEOUT_MS, ou seja, anunciava um teto
  # inalcançável. Sem as linhas, valem os defaults do index.js.
  QR_IDLE_DESTROY_MS = "180000"
  SEND_REQUEST_TIMEOUT_MS = "55000"
  WA_SEND_LEDGER_DIR = "/app/.wwebjs_auth/.send-ledger"
  WA_SEND_LEDGER_RETENTION_HOURS = "168"

# Sessão do WhatsApp (LocalAuth) persiste no volume — sobrevive a restart/deploy.
# IMPORTANTE: volume Fly prende a UMA máquina. Rode `fly scale count 1` para garantir
# uma única máquina — senão as sessões se dividem entre volumes diferentes.
[[mounts]]
  source = "wa_data"
  destination = "/app/.wwebjs_auth"

# Sem services/http_service: não há rota no Fly Proxy público. O processo escuta
# IPv6 para o DNS spreading-wa.internal; o check abaixo não publica a porta.
[checks]
  [checks.health]
    type = "http"
    port = 3000
    interval = "15s"
    timeout = "10s"
    grace_period = "60s"
    method = "get"
    path = "/health"

# ATENÇÃO — este bloco é o que a máquina REALMENTE roda. Não suba sem decidir o custo.
#
# Histórico: em 30/07 o shared-cpu-2x acusava steal de ~70% do CPU do período, loadavg
# 5.7 e tempo útil de ~3%, e todo page.evaluate falhava; em 08/08 a VM inteira travou
# (TCP aceitava em 0,03s, nenhuma resposta HTTP em 8s, SSH fora, 20min sem um log) até
# restart manual. A resposta a isso NÃO foi CPU dedicada: foram os watchdogs e o vigia
# externo (bdc278b, 1a30213), que é o que segura este serviço hoje.
#
# Medido em 09/08 nesta máquina: loadavg 0,03 e CPU pressure 0,5% (avg300) — ociosa em
# repouso. A carga é em picos (envio de campanha), e é neles que o throttle de baseline
# do shared-cpu morde. performance-2x/4gb custaria US$100,15/mês em gru contra US$34,56
# deste shared-cpu-2x/4gb. Se os picos voltarem a travar, o passo barato é
# shared-cpu-4x/4gb (US$36,80): dobra vCPU e cota de baseline por +US$2,24/mês.
#
# Memória: cada WhatsApp conectado = 1 Chromium. Medido com as 2 sessões da época de
# MAX_WHATSAPP_SESSIONS=2: 1,77GB em uso, 2,2GB livres. Com o teto em 1 sessão
# (18/08/2026) sobra bem mais: 1,17GB em uso e 2,4GB livres com o Chromium de pé.
# Os 4gb passaram a ser folga, não necessidade — mas a memória NUNCA foi o gargalo
# aqui (o que estoura é a cota de baseline de CPU), então descer para 2gb economiza
# ~US$16/mês sem resolver nada e tira a margem dos picos de Chromium, que é o
# cenário do travamento de 08/08. Suba os dois juntos para aceitar mais números.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
