app = "spreading-wa-staging"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "always"

[env]
  PORT = "3000"
  WA_CAPABILITY_ISSUER = "spreading-web"
  WA_CAPABILITY_AUDIENCE = "spreading-wa"
  MAX_WHATSAPP_SESSIONS = "1"
  SESSION_START_STAGGER_MS = "12000"
  SESSION_INIT_TIMEOUT_MS = "90000"
  QR_BOOTSTRAP_TIMEOUT_MS = "90000"
  QR_BOOTSTRAP_MAX_ATTEMPTS = "2"
  QR_BOOTSTRAP_RETRY_MS = "2000"
  GROUP_SYNC_TIMEOUT_MS = "45000"
  QR_IDLE_DESTROY_MS = "180000"
  SEND_TIMEOUT_MS = "60000"
  SEND_REQUEST_TIMEOUT_MS = "55000"

[[mounts]]
  source = "wa_data_staging"
  destination = "/app/.wwebjs_auth"

[checks]
  [checks.health]
    type = "http"
    port = 3000
    interval = "15s"
    timeout = "10s"
    grace_period = "60s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
