{% extends "base.html" %}
{% block title %}Senha alterada — Spreading{% endblock %}

{% block head_extra %}
<style>
  .auth-wrap { max-width: 26.5rem; margin: 2.5rem auto; }
  .auth-head { text-align: center; margin-bottom: 1.5rem; }
  .auth-head h1 { margin: .55rem 0 0; font-size: 1.55rem; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; text-wrap: balance; }
  .auth-head h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; }
  .auth-card { padding: 1.5rem 1.6rem; text-align: center; }
  .auth-card .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 1.2rem; line-height: 1.5; }
  .ic { width: 3rem; height: 3rem; margin: 0 auto 1rem; border-radius: var(--r-lg);
    display: flex; align-items: center; justify-content: center;
    background: var(--green-bg); color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 35%, transparent); }
  .ic .lucide { width: 1.4rem; height: 1.4rem; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="ic"><i data-lucide="check"></i></div>
    <div class="auth-head" style="margin-bottom:.6rem;">
      <h1>Senha <em>alterada</em></h1>
    </div>
    <p class="sub">Pronto. Você já pode entrar com a nova senha.</p>
    <a class="btn" href="{% url 'login' %}" style="width:100%;"><i data-lucide="log-in"></i> Entrar</a>
  </div>
</div>
{% endblock %}
{% block scripts %}<script>renderIcons();</script>{% endblock %}
