# Fly.io — app Django (web + workers). Região São Paulo (gru).
# Secrets (NÃO versionar): fly secrets set DJANGO_SECRET_KEY=... DATABASE_URL=... \
#   WHATSAPP_API_KEY=... SECRETS_FERNET_KEY=... AMAZON_* EMAIL_* TELEGRAM_API_ID=...
# (login web do ML NÃO precisa de secret: roda no Chromium local — ver ml_conexao.py)
app = "spreading-web"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "always"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "spreading-web.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://spreading-web.fly.dev"
  # Piloto Awin ativo; cada afiliado conecta o próprio token pela tela Conta.
  AWIN_INTEGRATION_ENABLED = "1"
  ML_AUTH_DIR = "/data/ml_sessions"
  # Serviço do WhatsApp na rede privada do Fly (.internal).
  WHATSAPP_API_URL = "http://spreading-wa.internal:3000"

# migra o banco a cada deploy, antes de trocar as máquinas.
# (createcachetable saiu: o cache é LocMem por processo -- ver settings.py --, então
# a tabela nunca foi lida por ninguém.)
[deploy]
  release_command = "sh -c 'env RELEASE_COMMAND=1 python django/manage.py check --deploy && env RELEASE_COMMAND=1 python django/manage.py migrate --noinput && env RELEASE_COMMAND=1 python django/manage.py tenant_rls --enable && env TENANT_SYSTEM_PROCESS=1 python django/manage.py bootstrap_superuser'"

# Volume persistente das sessões do ML (auth_{id}.json). Preso a UMA máquina:
# por isso web + workers rodam juntos (honcho) e não escalamos horizontalmente.
[[mounts]]
  source = "ml_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    headers = { Host = "spreading-web.fly.dev", X-Forwarded-Proto = "https" }

# ATENÇÃO — este bloco é o que a máquina REALMENTE roda. Não suba sem decidir o custo.
#
# Esta VM roda gunicorn + 5 workers de automação + Chromium (raspagem, Link Builder e o
# live view do login ML) ao mesmo tempo, em CPU compartilhada. Isso tem um preço técnico
# conhecido e aceito: a Fly cobra o shared-cpu por cota de baseline e aplica throttle
# quando ela acaba. Medido em 09/08 nesta máquina: loadavg 7,29 em 2 vCPUs e CPU pressure
# de 73% (avg300) com apenas ~15% de CPU efetivamente consumida — ou seja, os processos
# ficam prontos e não são escalonados. O painel fica lento sob raspagem por causa disso.
# Quem impede que o throttle vire indisponibilidade são os watchdogs (bdc278b, 1a30213).
#
# performance-2x/4gb resolveria o throttle, mas custa US$100,15/mês em gru contra US$18,40
# deste shared-cpu-2x/2gb — 5,4×. O passo intermediário barato, se o throttle apertar, é
# shared-cpu-4x/2gb (US$20,64): dobra vCPU e cota de baseline por +US$2,24/mês.
# Preços da tabela da região gru, que tem markup de ~1,55× sobre a tabela base.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
