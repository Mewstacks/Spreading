# Ambiente Fly isolado: nunca compartilha volume, banco, WhatsApp ou host com produção.
app = "spreading-web-staging"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "spreading-web-staging.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://spreading-web-staging.fly.dev"
  PUBLIC_BASE_URL = "https://spreading-web-staging.fly.dev"
  ML_AUTH_DIR = "/data/ml_sessions"
  WHATSAPP_API_URL = "http://spreading-wa-staging.internal:3000"
  # Sem isto o settings cai em "production" (o default olha FLY_APP_NAME, que a Fly
  # sempre injeta) — homologação se identificava como produção no Sentry e nos logs.
  APP_ENV = "staging"
  SENTRY_ENV = "staging"
  # Automação frágil LIGADA explicitamente. Não basta APP_ENV="staging": o
  # _AUTOMATION_DEFAULT de settings.py é "0" para staging E para production, então
  # sem estas quatro linhas o Link Builder, o login/relatórios do ML e o WhatsApp Web
  # nascem desligados aqui — e a tela responde "desativado para esta organização",
  # que é justamente o que não dá para homologar.
  # TELETHON_RELINK_ENABLED fica de fora de propósito (checks.py accounts.E011).
  ML_BROWSER_LOGIN_ENABLED = "1"
  ML_LINK_BUILDER_ENABLED = "1"
  ML_BROWSER_REPORTS_ENABLED = "1"
  WHATSAPP_WEB_ENABLED = "1"

[deploy]
  release_command = "sh -c 'python django/manage.py migrate --noinput && python django/manage.py bootstrap_superuser'"

[[mounts]]
  source = "ml_data_staging"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "performance-2x"
  memory = "4gb"
