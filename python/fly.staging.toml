# Ambiente Fly isolado: nunca compartilha volume, banco, WhatsApp ou host com produção.
app = "spreading-web-staging"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[restart]]
  policy = "always"

[env]
  APP_ENV = "staging"
  SENTRY_ENV = "staging"
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "spreading-web-staging.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://spreading-web-staging.fly.dev"
  PUBLIC_BASE_URL = "https://spreading-web-staging.fly.dev"
  ML_AUTH_DIR = "/data/ml_sessions"
  WHATSAPP_API_URL = "http://spreading-wa-staging.internal:3000"
  AWIN_INTEGRATION_ENABLED = "1"
  # Automação frágil LIGADA explicitamente. Não basta o APP_ENV="staging" acima: o
  # _AUTOMATION_DEFAULT de settings.py é "0" para staging E para production, então
  # sem estas quatro linhas o Link Builder, o login/relatórios do ML e o WhatsApp Web
  # nascem desligados aqui — e a tela responde "desativado para esta organização",
  # que é justamente o que não dá para homologar.
  # TELETHON_RELINK_ENABLED fica de fora de propósito (checks.py accounts.E011).
  ML_BROWSER_LOGIN_ENABLED = "1"
  ML_BROWSER_REPORTS_ENABLED = "1"
  AMAZON_BROWSER_LOGIN_ENABLED = "1"
  ML_LINK_BUILDER_ENABLED = "1"
  WHATSAPP_WEB_ENABLED = "1"
  # Cupons de ativação do ML (clique no container público, sem código digitável).
  # Ligado SÓ aqui: em produção ele entra por organização, depois de validar o texto
  # da mensagem. É seguro em homologação porque não há destino de envio configurado.
  ML_CUPONS_ATIVACAO_ENABLED = "1"

[deploy]
  release_command = "sh -c 'python django/manage.py migrate --noinput && env TENANT_SYSTEM_PROCESS=1 python django/manage.py bootstrap_superuser'"

[[mounts]]
  source = "ml_data_staging"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"
    headers = { Host = "spreading-web-staging.fly.dev", X-Forwarded-Proto = "https" }

[[vm]]
  size = "performance-2x"
  memory = "4gb"
